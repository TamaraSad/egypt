<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Inter", sans-serif; color: #fff;
    background: radial-gradient(900px 500px at 15% 0%, rgba(22,183,122,.28), transparent 60%), linear-gradient(160deg, #0b1d36 0%, #0f2c52 100%); position: relative; }
  .txt { position: absolute; left: 64px; top: 70px; width: 540px; z-index: 2; }
  .logo { height: 46px; display: block; margin-bottom: 34px; }
  .flag { display: inline-flex; align-items: center; gap: 12px; padding: 6px 16px 6px 8px; border-radius: 999px; background: rgba(22,183,122,.18); color: #7ff0c2; font-weight: 700; font-size: 20px; margin-bottom: 22px; }
  .flag i { width: 42px; height: 28px; border-radius: 5px; background: linear-gradient(90deg, #008751 33.3%, #fff 33.3% 66.6%, #008751 66.6%); }
  h1 { font-size: 52px; line-height: 1.08; font-weight: 800; letter-spacing: -.01em; }
  .code { margin-top: 30px; display: inline-flex; align-items: center; gap: 16px; border: 3px dashed #16b77a; border-radius: 16px; padding: 12px 20px; background: rgba(7,20,39,.6); }
  .code small { font-size: 18px; color: #a9b8cc; font-weight: 600; }
  .code b { font-family: "DejaVu Sans Mono", monospace; font-size: 34px; letter-spacing: .06em; }
  .age { position: absolute; left: 64px; bottom: 44px; display: flex; align-items: center; gap: 12px; font-size: 18px; color: #a9b8cc; }
  .age span { width: 46px; height: 46px; border-radius: 50%; border: 3px solid #d6453d; background: #fff; color: #d6453d; font-weight: 800; display: grid; place-items: center; font-size: 16px; }
  .art { position: absolute; right: -70px; top: 70px; width: 590px; }
</style></head>
<body>
  <div class="txt">
    <img class="logo" src="../assets/img/1xbet-logo.png" alt="">
    <div class="flag"><i></i>Independent guide for Nigerian players</div>
    <h1>Sign Up, Promo Code &amp; Welcome Bonus</h1>
    <div class="code"><small>Promo code</small><b>EGYPTONEX20</b></div>
  </div>
  <img class="art" src="../assets/img/home-hero.png" alt="">
  <div class="age"><span>18+</span>Bet responsibly · T&amp;Cs apply</div>
</body></html>
