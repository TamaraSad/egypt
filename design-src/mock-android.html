<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="mock-base.css">
<style>
  body { width: 600px; height: 520px; }
  .phone { left: 190px; top: 16px; width: 236px; height: 490px; border-radius: 30px; transform: rotate(-4deg); }
  .phone .screen { border-radius: 23px; background: #e9eef4; }
  .punch { position: absolute; top: 12px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #05080f; z-index: 5; }
  .sbar { height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 11px; font-weight: 700; color: #3b4a5c; }
  .browser { margin: 0 10px; height: 30px; border-radius: 15px; background: #fff; display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 10.5px; color: #3b4a5c; font-weight: 600; }
  .page { margin: 10px; border-radius: 14px; background: #0b1d36; height: 150px; padding: 14px; color: #fff; }
  .page b { font-size: 15px; display: block; } .page small { font-size: 10px; color: #9fb0c6; }
  .dl { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dl div { border-radius: 10px; padding: 8px; font-size: 10px; font-weight: 800; text-align: center; background: rgba(255,255,255,.1); }
  .dl div.on { background: #16b77a; color: #05261a; }
  .scrim { position: absolute; inset: 0; background: rgba(5,10,20,.45); }
  .sheet { position: absolute; left: 10px; right: 10px; bottom: 14px; background: #fff; border-radius: 22px; padding: 16px; }
  .app { display: flex; gap: 12px; align-items: center; }
  .icon { width: 48px; height: 48px; border-radius: 13px; background: linear-gradient(145deg, #1a8fe0, #0b4f9c); display: grid; place-items: center; }
  .icon i { width: 24px; height: 24px; border-radius: 50%; border: 3px solid #fff; position: relative; }
  .icon i::after { content: ""; position: absolute; inset: 5px; background: #fff; clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%); }
  .app b { display: block; font-size: 14px; } .app small { font-size: 10.5px; color: #6b7a8c; }
  .sheet p { font-size: 11.5px; color: #3b4a5c; margin: 12px 0 14px; line-height: 1.4; }
  .acts { display: flex; justify-content: flex-end; gap: 18px; font-size: 12.5px; font-weight: 800; }
  .acts span:first-child { color: #6b7a8c; } .acts span:last-child { color: #0e8a5b; }
  .prog { height: 5px; border-radius: 3px; background: #e2e8f0; margin: 2px 0 12px; overflow: hidden; }
  .prog i { display: block; width: 72%; height: 100%; background: #16b77a; }

  .c1 { left: 6px; top: 96px; width: 200px; transform: rotate(-3deg); display: flex; gap: 10px; align-items: center; }
  .c1 b { display: block; font-size: 12px; } .c1 small { font-size: 10px; }
  .c2 { right: 2px; top: 150px; width: 176px; transform: rotate(4deg); }
  .c2 b { font-size: 12px; display: block; margin-bottom: 6px; }
  .c2 p { display: flex; gap: 7px; align-items: center; font-size: 10.5px; color: #3b4a5c; margin-bottom: 4px; }
  .c2 .ok { width: 15px; height: 15px; font-size: 8px; }
</style></head>
<body>
  <div class="glow" style="left:80px;top:30px;width:440px;height:440px"></div>
  <div class="phone"><div class="screen">
    <div class="punch"></div>
    <div class="sbar"><span>9:41</span><span>▮▮▮ 86%</span></div>
    <div class="browser"><span class="lock"></span>https://</div>
    <div class="page"><b>Mobile apps</b><small>Choose your device</small>
      <div class="dl"><div class="on">Android</div><div>iPhone</div></div>
    </div>
    <div class="scrim"></div>
    <div class="sheet">
      <div class="app"><span class="icon"><i></i></span><div><b>1xBet</b><small>Sports · Casino</small></div></div>
      <p>Do you want to install this app?</p>
      <div class="prog"><i></i></div>
      <div class="acts"><span>Cancel</span><span>Install</span></div>
    </div>
  </div></div>

  <div class="card-float c1"><span class="ok">✓</span><div><b>Downloaded from</b><small class="muted">the official site</small></div></div>
  <div class="card-float c2"><b>Before you install</b>
    <p><span class="ok">✓</span>Official site only</p>
    <p><span class="ok">✓</span>Enough free space</p>
    <p><span class="ok">✓</span>Turn off “unknown apps” after</p>
  </div>
</body></html>
