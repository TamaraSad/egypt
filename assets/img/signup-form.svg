<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" role="img">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#16b77a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#16b77a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="230" cy="190" r="180" fill="url(#glow)"/>

  <!-- форма -->
  <g transform="translate(70 40)" filter="url(#sh)">
    <rect width="250" height="300" rx="20" fill="#fff"/>
    <rect x="22" y="22" width="120" height="12" rx="6" fill="#0b1d36"/>
    <rect x="22" y="42" width="80" height="8" rx="4" fill="#5d6b7e" opacity=".4"/>
    <!-- вкладки -->
    <rect x="22" y="66" width="66" height="26" rx="13" fill="#16b77a"/>
    <rect x="94" y="66" width="66" height="26" rx="13" fill="#f3f6fa"/>
    <rect x="166" y="66" width="62" height="26" rx="13" fill="#f3f6fa"/>
    <rect x="36" y="76" width="38" height="6" rx="3" fill="#fff"/>
    <rect x="108" y="76" width="38" height="6" rx="3" fill="#5d6b7e" opacity=".45"/>
    <rect x="180" y="76" width="34" height="6" rx="3" fill="#5d6b7e" opacity=".45"/>
    <!-- поля -->
    <rect x="22" y="108" width="206" height="36" rx="10" fill="#f3f6fa" stroke="#dde4ee"/>
    <rect x="34" y="120" width="26" height="12" rx="3" fill="#008751"/>
    <rect x="42" y="120" width="10" height="12" fill="#fff"/>
    <rect x="70" y="122" width="90" height="8" rx="4" fill="#0b1d36" opacity=".55"/>
    <rect x="22" y="154" width="206" height="36" rx="10" fill="#f3f6fa" stroke="#dde4ee"/>
    <rect x="34" y="168" width="60" height="8" rx="4" fill="#0b1d36" opacity=".55"/>
    <!-- промокод -->
    <rect x="22" y="200" width="206" height="36" rx="10" fill="#eaf6f0" stroke="#16b77a" stroke-dasharray="6 5" stroke-width="2"/>
    <text x="36" y="223" font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="13" fill="#0e8a5b">PROMO CODE</text>
    <!-- кнопка -->
    <rect x="22" y="248" width="206" height="36" rx="10" fill="#16b77a"/>
    <rect x="92" y="262" width="66" height="8" rx="4" fill="#05261a" opacity=".8"/>
  </g>

  <!-- телефон с SMS -->
  <g transform="translate(296 128) rotate(6)" filter="url(#sh)">
    <rect width="104" height="190" rx="20" fill="#12294a" stroke="#2b4a7c" stroke-width="2"/>
    <rect x="8" y="10" width="88" height="170" rx="14" fill="#173a68"/>
    <rect x="36" y="16" width="32" height="5" rx="2.5" fill="#0b1d36"/>
    <rect x="16" y="40" width="72" height="46" rx="10" fill="#fff"/>
    <rect x="24" y="50" width="34" height="6" rx="3" fill="#5d6b7e" opacity=".5"/>
    <text x="24" y="76" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#0b1d36" letter-spacing="2">4821</text>
    <rect x="16" y="100" width="72" height="10" rx="5" fill="#fff" opacity=".15"/>
    <rect x="16" y="118" width="52" height="10" rx="5" fill="#fff" opacity=".15"/>
  </g>

  <!-- значок готово -->
  <g transform="translate(86 318)" filter="url(#sh)">
    <circle r="28" fill="#16b77a"/>
    <path d="M-12 0 L-3 9 L13 -9" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
