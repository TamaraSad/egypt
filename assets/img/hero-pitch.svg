<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#16b77a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#16b77a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a8f5c"/>
      <stop offset="1" stop-color="#22b673"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3560"/>
      <stop offset="1" stop-color="#0b1d36"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12294a"/>
      <stop offset="1" stop-color="#173a68"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <circle cx="290" cy="230" r="215" fill="url(#glow)"/>

  <!-- поле -->
  <polygon points="40,346 520,346 520,360 40,360" fill="#0b5c3a"/>
  <polygon points="40,346 520,346 450,170 110,170" fill="url(#pitch)"/>
  <g fill="#ffffff" opacity=".07">
    <polygon points="110,170 178,170 152,346 40,346"/>
    <polygon points="246,170 314,170 324,346 236,346"/>
    <polygon points="382,170 450,170 520,346 408,346"/>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.5">
    <polygon points="64,334 496,334 434,182 126,182"/>
    <line x1="95" y1="258" x2="465" y2="258"/>
    <ellipse cx="280" cy="258" rx="54" ry="20"/>
    <polygon points="228,182 332,182 338,200 222,200"/>
    <polygon points="206,334 354,334 346,310 214,310"/>
  </g>
  <circle cx="280" cy="258" r="4" fill="#fff" opacity=".8"/>

  <!-- мяч -->
  <ellipse cx="178" cy="326" rx="22" ry="6" fill="#000" opacity=".25"/>
  <g transform="translate(178 300)">
    <circle r="22" fill="#fff"/>
    <path d="M0-8 L8-2 L5 8 L-5 8 L-8-2 Z" fill="#0b1d36"/>
    <path d="M0-8 V-21 M8-2 L20-6 M5 8 L12 18 M-5 8 L-12 18 M-8-2 L-20-6" stroke="#0b1d36" stroke-width="2.5" fill="none"/>
  </g>

  <!-- телефон -->
  <g transform="translate(340 48) rotate(8)" filter="url(#sh)">
    <rect width="156" height="300" rx="26" fill="url(#phone)" stroke="#2b4a7c" stroke-width="2"/>
    <rect x="10" y="12" width="136" height="276" rx="18" fill="url(#screen)"/>
    <rect x="58" y="20" width="40" height="6" rx="3" fill="#0b1d36"/>
    <rect x="22" y="40" width="48" height="18" rx="9" fill="#d6453d"/>
    <circle cx="33" cy="49" r="3.5" fill="#fff"/>
    <rect x="40" y="46" width="22" height="6" rx="3" fill="#fff" opacity=".9"/>
    <circle cx="34" cy="98" r="14" fill="#f4a62a"/>
    <circle cx="122" cy="98" r="14" fill="#16b77a"/>
    <text x="78" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#fff">2 : 1</text>
    <rect x="22" y="138" width="112" height="8" rx="4" fill="#fff" opacity=".12"/>
    <rect x="22" y="138" width="70" height="8" rx="4" fill="#16b77a"/>
    <rect x="22" y="156" width="112" height="8" rx="4" fill="#fff" opacity=".12"/>
    <rect x="22" y="156" width="46" height="8" rx="4" fill="#f4a62a"/>
    <rect x="22" y="174" width="112" height="8" rx="4" fill="#fff" opacity=".12"/>
    <rect x="22" y="174" width="88" height="8" rx="4" fill="#5aa3ff"/>
    <rect x="22" y="200" width="112" height="30" rx="10" fill="#fff" opacity=".08"/>
    <rect x="22" y="238" width="112" height="30" rx="10" fill="#fff" opacity=".08"/>
    <rect x="32" y="211" width="54" height="8" rx="4" fill="#fff" opacity=".5"/>
    <rect x="32" y="249" width="40" height="8" rx="4" fill="#fff" opacity=".5"/>
  </g>

  <!-- карточка статистики -->
  <g transform="translate(62 70)" filter="url(#sh)">
    <rect width="176" height="92" rx="16" fill="#fff"/>
    <rect x="18" y="18" width="70" height="9" rx="4.5" fill="#0b1d36" opacity=".85"/>
    <rect x="18" y="34" width="46" height="7" rx="3.5" fill="#5d6b7e" opacity=".5"/>
    <rect x="106" y="44" width="12" height="30" rx="3" fill="#16b77a"/>
    <rect x="124" y="30" width="12" height="44" rx="3" fill="#0b1d36"/>
    <rect x="142" y="54" width="12" height="20" rx="3" fill="#f4a62a"/>
    <rect x="18" y="56" width="74" height="18" rx="9" fill="#eaf6f0"/>
    <circle cx="30" cy="65" r="4" fill="#16b77a"/>
    <rect x="40" y="62" width="44" height="6" rx="3" fill="#0e8a5b" opacity=".7"/>
  </g>

  <!-- значок «проверено» -->
  <g transform="translate(318 330)" filter="url(#sh)">
    <circle r="26" fill="#16b77a"/>
    <path d="M-11 0 L-3 8 L12 -8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
