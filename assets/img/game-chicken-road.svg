    <g transform="translate(230 228)"><circle r="26" fill="#3b4656" stroke="#16b77a" stroke-width="3"/><text y="5" fill="#fff">1.5x</text></g>
    <g transform="translate(310 228)"><circle r="26" fill="#3b4656" stroke="#5d6b7e" stroke-width="3"/><text y="5" fill="#cfd8e3">2.1x</text></g>
    <g transform="translate(390 228)"><circle r="26" fill="#3b4656" stroke="#5d6b7e" stroke-width="3"/><text y="5" fill="#cfd8e3">3.0x</text></g>
    <g transform="translate(470 228)"><circle r="26" fill="#3b4656" stroke="#f4a62a" stroke-width="3"/><text y="5" fill="#f4a62a">4.8x</text></g>
  </g>
  <!-- машины -->
  <g transform="translate(304 60)">
    <rect x="-22" y="0" width="44" height="80" rx="12" fill="#f4a62a"/>
    <rect x="-16" y="12" width="32" height="18" rx="5" fill="#1c2635"/>
    <rect x="-16" y="52" width="32" height="14" rx="5" fill="#1c2635"/>
  </g>
  <g transform="translate(468 300)">
    <rect x="-22" y="0" width="44" height="80" rx="12" fill="#d6453d"/>
    <rect x="-16" y="12" width="32" height="18" rx="5" fill="#1c2635"/>
    <rect x="-16" y="52" width="32" height="14" rx="5" fill="#1c2635"/>
