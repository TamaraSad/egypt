    <path d="M14 0 H326 a14 14 0 0 1 14 14 V62 a18 18 0 0 0 0 36 V146 a14 14 0 0 1 -14 14 H14 a14 14 0 0 1 -14 -14 V98 a18 18 0 0 0 0 -36 V14 a14 14 0 0 1 14 -14 Z" fill="url(#tk)"/>
    <line x1="232" y1="16" x2="232" y2="144" stroke="#fff" stroke-opacity=".3" stroke-width="2" stroke-dasharray="6 7"/>
    <text x="286" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="46" fill="#f4a62a">%</text>
    <rect x="30" y="32" width="120" height="12" rx="6" fill="#fff" opacity=".9"/>
    <rect x="30" y="54" width="84" height="9" rx="4.5" fill="#fff" opacity=".45"/>
    <rect x="30" y="86" width="170" height="7" rx="3.5" fill="#fff" opacity=".22"/>
    <rect x="30" y="100" width="150" height="7" rx="3.5" fill="#fff" opacity=".22"/>
    <rect x="30" y="114" width="164" height="7" rx="3.5" fill="#fff" opacity=".22"/>
    <rect x="30" y="128" width="120" height="7" rx="3.5" fill="#fff" opacity=".22"/>
  </g>

  <!-- лупа над условиями -->
