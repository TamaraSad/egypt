      <rect x="-36" y="-22" width="62" height="9" rx="4.5" fill="#0b1d36" opacity=".8"/>
      <rect x="-36" y="-6" width="72" height="9" rx="4.5" fill="#0b1d36" opacity=".55"/>
      <rect x="-36" y="10" width="50" height="9" rx="4.5" fill="#d6453d" opacity=".85"/>
    </g>
    <circle r="46" fill="none" stroke="#0b1d36" stroke-width="9"/>
    <path d="M33 33 L66 66" stroke="#0b1d36" stroke-width="14" stroke-linecap="round"/>
    <path d="M33 33 L66 66" stroke="#f4a62a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- чек-лист -->
  <g transform="translate(300 176)" filter="url(#sh)">
    <rect width="112" height="116" rx="14" fill="#fff"/>
    <g fill="#16b77a"><circle cx="22" cy="26" r="8"/><circle cx="22" cy="58" r="8"/><circle cx="22" cy="90" r="8"/></g>
    <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 26 l3 3 l5 -6"/><path d="M18 58 l3 3 l5 -6"/><path d="M18 90 l3 3 l5 -6"/>
