<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" role="img">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0b1d36" flood-opacity=".22"/>
